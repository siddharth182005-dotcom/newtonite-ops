# Development PostgreSQL only (dev credentials; never reuse in production). Compose was NOT executed when this project was built.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: newtonite, POSTGRES_PASSWORD: newtonite, POSTGRES_DB: newtonite }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U newtonite -d newtonite"], interval: 5s, timeout: 3s, retries: 10 }
volumes: { pgdata: {} }
